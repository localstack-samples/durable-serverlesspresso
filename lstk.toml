# Project-local lstk config. Use with: lstk --config lstk.toml <command>
[[containers]]
type = "aws"
tag  = "dev"
port = "4566"
env  = ["workshop"]

[env.workshop]
PERSISTENCE = "1"
# Keep the default SNAPSHOT_LOAD_STRATEGY (ON_REQUEST). ON_STARTUP restores every service at boot,
# but a request that reaches a service before its restore can get that service's empty state saved
# over the snapshot, which loses it. See LOCALSTACK.md.
DEBUG = "1"
